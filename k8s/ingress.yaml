# Optional - not in kustomization.yaml. Needs an nginx ingress controller
# (minikube: `minikube addons enable ingress`), then: kubectl apply -f k8s/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travel-ml
  namespace: travel-ml
spec:
  ingressClassName: nginx
  rules:
    - host: travel.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: travel-streamlit, port: {number: 80}}}
    - host: api.travel.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: travel-price-api, port: {number: 80}}}
