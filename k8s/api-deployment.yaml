# Objective 4: flight price API on Kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-price-api
  namespace: travel-ml
  labels: {app: travel-price-api}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # zero-downtime deploys
  selector:
    matchLabels: {app: travel-price-api}
  template:
    metadata:
      labels: {app: travel-price-api}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: api
          image: travel-price-api:latest   # Jenkins replaces this with the build tag
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000, name: http}]
          envFrom: [{configMapRef: {name: travel-api-config}}]
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: travel-api-config
  namespace: travel-ml
data:
  GUNICORN_WORKERS: "2"
  GUNICORN_THREADS: "4"
---
apiVersion: v1
kind: Service
metadata:
  name: travel-price-api
  namespace: travel-ml
spec:
  selector: {app: travel-price-api}
  ports: [{port: 80, targetPort: http, name: http}]
  type: ClusterIP
